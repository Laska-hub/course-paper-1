[project]
name = "course_paper_1"
version = "0.1.0"
description = "Transaction analysis course project"
authors = [
    { name = "Olesia Laskovets", email = "olesya_izvarina@mail.ru" }
]
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pandas>=2.2,<3.0",
    "openpyxl>=3.1,<4.0",
    "requests>=2.32,<3.0"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=4.1,<5.0",
    "black>=24.0,<25.0",
    "flake8>=7.0,<8.0",
    "isort>=5.13,<6.0",
    "mypy>=1.8,<2.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true

[tool.black]
line-length = 79
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 79
